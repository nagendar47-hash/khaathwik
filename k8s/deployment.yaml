apiVersion: apps/v1
kind: Deployment
metadata:
  name: khaathwik
spec:
  replicas: 2
  selector:
    matchLabels:
      app: khaathwik
  template:
    metadata:
      labels:
        app: khaathwik
    spec:
      containers:
      - name: khaathwik
        image: nagendra99/khaathwik:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: khaathwik-svc
spec:
  type: NodePort
  selector:
    app: khaathwik
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30009
